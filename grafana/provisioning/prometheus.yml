global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: avertcare-backend
    metrics_path: /metrics
    scrape_interval: 5s
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: avertcare-api
          tier: inference-engine

  - job_name: prometheus
    metrics_path: /metrics
    scrape_interval: 5s
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: prometheus-internal
